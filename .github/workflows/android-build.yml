name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Restore release signing key
        env:
          PEC_KEYSTORE_BASE64: ${{ secrets.PEC_KEYSTORE_BASE64 }}
          PEC_KEYSTORE_PATH: ${{ runner.temp }}/pec-board-release.p12
        run: |
          test -n "$PEC_KEYSTORE_BASE64"
          printf '%s' "$PEC_KEYSTORE_BASE64" | base64 --decode > "$PEC_KEYSTORE_PATH"
      - name: Build signed release APK
        env:
          PEC_KEYSTORE_PATH: ${{ runner.temp }}/pec-board-release.p12
          PEC_KEYSTORE_PASSWORD: ${{ secrets.PEC_KEYSTORE_PASSWORD }}
          PEC_KEY_ALIAS: ${{ secrets.PEC_KEY_ALIAS }}
          PEC_KEY_PASSWORD: ${{ secrets.PEC_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Name release APK
        run: |
          mkdir -p outputs
          cp app/build/outputs/apk/release/app-release.apk outputs/PEC-Board.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PEC-Board-release-apk
          path: outputs/PEC-Board.apk
          if-no-files-found: error

